<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="WoCo Scrabble tile icon">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#6a5744" />
			<stop offset="100%" stop-color="#4c3f32" />
		</linearGradient>
		<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#f3dfb7" />
			<stop offset="100%" stop-color="#e2c78f" />
		</linearGradient>
		<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#2d241b" flood-opacity="0.42" />
		</filter>
	</defs>

	<rect width="512" height="512" rx="82" fill="url(#bg)" />

	<g filter="url(#shadow)">
		<rect x="104" y="104" width="304" height="304" rx="32" fill="url(#tile)" stroke="#b88f55" stroke-width="10" />
		<rect x="122" y="122" width="268" height="268" rx="22" fill="none" stroke="#f8e9c8" stroke-opacity="0.58" stroke-width="3" />
	</g>

	<text
		x="256"
		y="250"
		text-anchor="middle"
		dominant-baseline="middle"
		font-family="Georgia, 'Times New Roman', serif"
		font-size="92"
		font-weight="700"
		letter-spacing="0.5"
		fill="#4a3420"
	>
		WoCo
	</text>

	<text
		x="360"
		y="356"
		text-anchor="end"
		dominant-baseline="alphabetic"
		font-family="Georgia, 'Times New Roman', serif"
		font-size="40"
		font-weight="700"
		fill="#5a3f26"
	>
		App
	</text>
</svg>
