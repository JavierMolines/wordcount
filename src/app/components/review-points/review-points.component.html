<h2 class="text-center text-[0.8rem] text-teal-900">Ingreso de puntos de descuento</h2>

<form autocomplete="off" class="mt-4" [formGroup]="form">
  <div formArrayName="inputs" class="flex flex-col">
    @for (player of players(); let position = $index; track position) {
      <div [formGroupName]="position" class="flex flex-col bg-gray-200 p-2 rounded-lg mb-2">
        <label>Jugador {{ player }} </label>
        <input
          required
          type="number"
          min="0"
          max="1000"
          class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm text-gray-800 shadow-sm placeholder-gray-400 focus:border-gray-500 focus:outline-none focus:ring-1 focus:ring-gray-500"
          formControlName="value"
          placeholder="Ingrese puntos en mano"
        />
      </div>
    }
  </div>
</form>

<div class="absolute left-0 bottom-0 w-full flex px-0 py-0">
  <a
    [routerLink]="['/game']"
    class="text-center cursor-pointer w-1/2 bg-white hover:bg-gray-200 rounded-2xl p-2"
  >
    Volver
  </a>

  @if (this.form.valid) {
    <a
      [routerLink]="['/end-game']"
      class="text-center cursor-pointer w-1/2 bg-white hover:bg-gray-200 rounded-2xl p-2"
    >
      Terminar
    </a>
  }
</div>
